# Strict-only stack: proof of work only. The image contains no collectors and no risk
# engine, the service has no route to the internet, and a config asking for
# standard mode is refused at startup. See docs/PRIVACY.md.
name: sweetcaptcha-strict

services:
  sweetcaptcha:
    image: sweetcaptcha:local-strict
    build:
      context: .
      target: strict
    restart: unless-stopped
    command: ["serve", "--config", "/etc/sweetcaptcha/config.yaml"]
    ports:
      - "${SWEETCAPTCHA_BIND:-127.0.0.1:8787}:8080"
    environment:
      SWEETCAPTCHA_MASTER_KEY: ${SWEETCAPTCHA_MASTER_KEY:?run scripts/init-env.sh first}
      SWEETCAPTCHA_ADMIN_TOKEN: ${SWEETCAPTCHA_ADMIN_TOKEN:-}
      SWEETCAPTCHA_DEMO_STRICT_SECRET: ${SWEETCAPTCHA_DEMO_STRICT_SECRET:?run scripts/init-env.sh first}
    volumes:
      - ./config/sweetcaptcha.strict.yaml:/etc/sweetcaptcha/config.yaml:ro
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [public, backend]
    healthcheck:
      test: ["CMD", "/sweetcaptcha", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  valkey:
    image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    read_only: true
    tmpfs: ["/data"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  public: {}
  backend:
    internal: true
