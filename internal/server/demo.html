<!doctype html>
<html lang="en"{{THEME_ATTR}}>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SweetCaptcha demo</title>
<style>{{CSS}}</style>
<script src="{{SCRIPT}}" async defer></script>
</head>
<body><main>
<h1>SweetCaptcha demo <small>{{VERSION}}</small></h1>
<p class="themes">Theme:{{THEMES}}</p>
<p>Site <strong>{{SITE}}</strong> ({{MODE}} mode), integrated through the <strong>{{API}}</strong>.</p>
<form id="form" method="post" action="/demo/verify">
<input type="hidden" name="k" value="{{KEY}}"><input type="hidden" name="provider" value="{{PROVIDER}}"><input type="hidden" name="theme" value="{{THEME}}">
<label>Your name<input id="name" type="text" name="name" autocomplete="off"></label>
<div id="widget" class="{{CLASS}}" data-sitekey="{{KEY}}" data-theme="{{THEME}}"></div>
<button id="send">Send</button>
</form>
<nav><p>The widget is always SweetCaptcha. A site's mode decides what it checks. The API choice only shows how a site already using that provider's code would connect.</p>{{LINKS}}</nav>
</main></body></html>
