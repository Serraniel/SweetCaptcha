name: Adversarial lab

# Maintained evasion tools against the current code. The results are reported, not
# asserted, because these tools change faster than any fixed expectation.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps --no-shell chromium
        working-directory: lab
      - name: Run
        working-directory: lab
        run: |
          export LAB_CHROMIUM="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)"
          npm run adversarial
      - name: Summary
        if: always()
        run: cat lab/out/adversarial.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: adversarial-results
          path: lab/out/adversarial.md
          if-no-files-found: ignore
